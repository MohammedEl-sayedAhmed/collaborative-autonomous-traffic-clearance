# Optional NVIDIA GPU override for Gazebo/RViz rendering.
#
# Use ONLY on a machine that has: an NVIDIA GPU, the NVIDIA driver, and the
# NVIDIA Container Toolkit installed. Enable it with:  GPU=1 ./run.sh <cmd>
#
# Note: this accelerates Gazebo *rendering* only. The RL training is tabular
# (CPU-only) and gets no benefit, and a GPU does not reduce system-RAM use.
services:
  ros:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all      # includes 'graphics' + 'display' for GL rendering
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, compute, utility]
